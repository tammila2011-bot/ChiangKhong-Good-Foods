<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChiangKhong Good Foods</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
    body { margin: 0; padding: 15px; background-color: #f8f9fa; color: #333; }
    
    .cover-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin-bottom: 15px;
    }

    /* ช่อง Search และ Filter */
    .filter-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    input[type="text"], select {
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: white;
      width: 100%;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #1e3d59;
      box-shadow: 0 0 5px rgba(30, 61, 89, 0.3);
    }

    .btn-location {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }
    .btn-location:active { background-color: #218838; }

    .geo-status {
      text-align: center;
      font-size: 13px;
      color: #0056b3;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #map {
      height: 300px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .shop-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .shop-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      border-top: 4px solid #1e3d59;
      display: flex;
      flex-direction: column;
    }
    .shop-card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #eee;
    }
    .shop-card-body {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .shop-card h3 { margin: 0 0 6px 0; font-size: 18px; color: #1e3d59; }
    .shop-card p { margin: 4px 0 10px 0; color: #555; font-size: 14px; flex: 1; }
    
    .distance-tag {
      font-size: 13px;
      color: #d9534f;
      font-weight: bold;
      margin-left: 6px;
    }
    .rating-badge {
      display: inline-block;
      font-size: 13px;
      color: #856404;
      background-color: #fff3cd;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ffeeba;
    }
    .rating-badge:active { background-color: #ffe8a1; }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      min-width: 70px;
      text-align: center;
      padding: 8px 0;
      background: #17a2b8;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }
    .btn-call { background: #28a745; }
    .btn-review { background: #ffc107; color: #333; font-weight: bold; }
    .btn-share { background: #6c757d; }

    .loading {
      text-align: center;
      padding: 20px;
      font-size: 16px;
      color: #666;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .star-rating {
      font-size: 30px;
      color: #ddd;
      cursor: pointer;
      margin: 10px 0;
      text-align: center;
    }
    .star-rating span.active { color: #ffc107; }
    .modal-content textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .modal-btn-group {
      display: flex;
      gap: 10px;
    }
    .btn-submit { background: #28a745; color: white; flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
    .btn-close { background: #dc3545; color: white; flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- รูปภาพหน้าปก -->
  <img src="food1.png" alt="ChiangKhong Good Foods" class="cover-image" onerror="this.style.display='none'">

  <!-- Filter & Search Section -->
  <div class="filter-box">
    <!-- ช่อง ค้นหาด้วยชื่อ/เมนู -->
    <input type="text" id="searchInput" placeholder="🔍 พิมพ์ค้นหาร้านค้า หรือ เมนูอาหาร..." oninput="onSearchInput()">

    <select id="typeSelect" onchange="onTypeChange()">
      <option value="">-- เลือกประเภทอาหารทั้งหมด --</option>
    </select>

    <select id="groupSelect" onchange="onGroupChange()" disabled>
      <option value="">-- เลือกกลุ่มร้านอาหาร --</option>
    </select>
  </div>

  <!-- ปุ่ม GPS -->
  <button type="button" class="btn-location" onclick="getUserLocation()">
    📍 แสดงตำแหน่งของฉัน (GPS)
  </button>
  <div id="geoStatus" class="geo-status"></div>

  <!-- Map Display -->
  <div id="map"></div>

  <!-- Shop List -->
  <div id="loading" class="loading">กำลังโหลดข้อมูลร้านอาหาร...</div>
  <div id="shopList" class="shop-list"></div>

  <!-- Modal สำหรับเขียนรีวิว -->
  <div id="reviewModal" class="modal">
    <div class="modal-content" style="text-align: center;">
      <h3 id="modalShopName" style="margin-top:0; color:#1e3d59;">ให้คะแนนร้านอาหาร</h3>
      <div class="star-rating" id="starContainer">
        <span onclick="setRating(1)">★</span>
        <span onclick="setRating(2)">★</span>
        <span onclick="setRating(3)">★</span>
        <span onclick="setRating(4)">★</span>
        <span onclick="setRating(5)">★</span>
      </div>
      <textarea id="reviewComment" placeholder="เขียนรีวิว หรือเมนูแนะนำ (ถ้ามี)..."></textarea>
      <div class="modal-btn-group">
        <button class="btn-submit" onclick="submitReview()">ส่งรีวิว</button>
        <button class="btn-close" onclick="closeReviewModal()">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- Modal สำหรับอ่านรีวิวทั้งหมด -->
  <div id="viewReviewsModal" class="modal">
    <div class="modal-content" style="max-height: 80vh; overflow-y: auto; text-align: left;">
      <h3 id="viewModalShopName" style="margin-top:0; color:#1e3d59; text-align:center;">รีวิวจากลูกค้า</h3>
      <div id="commentsListContainer" style="margin: 15px 0;"></div>
      <button class="btn-close" style="width:100%;" onclick="closeViewReviewsModal()">ปิด</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZsib5oN-RADz2qmMEkBzQpXnHkx9uEcNsmsGspaR7RLtIigIlBTTeWtdUln9T8NRd/exec";
    const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500&q=80"; // รูปภาพสำรองกรณีไม่มีรูป

    let rawData = [];
    let map;
    let markers = [];
    let userMarker = null;
    let userLat = null, userLng = null;
    
    let currentShopForReview = "";
    let selectedRating = 5;

    function initMap() {
      map = L.map('map').setView([20.2612, 100.4045], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
    }

    async function fetchData() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        rawData = await response.json();
        document.getElementById("loading").style.display = "none";
        populateTypes();
        displayShops(rawData); // แสดงร้านทั้งหมดก่อนในครั้งแรก
      } catch (error) {
        document.getElementById("loading").innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
        console.error("Error fetching data:", error);
      }
    }

    function populateTypes() {
      const typeSelect = document.getElementById("typeSelect");
      const types = [...new Set(rawData.map(item => item.type_name))];

      types.forEach(typeName => {
        if (typeName) {
          let opt = document.createElement("option");
          opt.value = typeName;
          opt.innerText = typeName;
          typeSelect.appendChild(opt);
        }
      });
    }

    // ฟังก์ชันค้นหาคำพิมพ์
    function onSearchInput() {
      const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
      
      // รีเซ็ต Dropdown เมื่อมีการพิมพ์ค้นหา
      document.getElementById("typeSelect").value = "";
      document.getElementById("groupSelect").value = "";
      document.getElementById("groupSelect").disabled = true;

      if (searchText === "") {
        displayShops(rawData);
        return;
      }

      const filtered = rawData.filter(item => {
        const shopName = (item.shop_name || "").toLowerCase();
        const detail = (item.detail || "").toLowerCase();
        return shopName.includes(searchText) || detail.includes(searchText);
      });

      displayShops(filtered);
    }

    function onTypeChange() {
      document.getElementById("searchInput").value = ""; // เคลียร์ช่อง Search
      const selectedType = document.getElementById("typeSelect").value;
      const groupSelect = document.getElementById("groupSelect");

      groupSelect.innerHTML = '<option value="">-- เลือกกลุ่มร้านอาหาร --</option>';
      groupSelect.disabled = true;

      if (!selectedType) {
        displayShops(rawData);
        return;
      }

      const filteredGroups = [...new Set(
        rawData
          .filter(item => item.type_name === selectedType)
          .map(item => item.group_name)
      )];

      filteredGroups.forEach(groupName => {
        if (groupName) {
          let opt = document.createElement("option");
          opt.value = groupName;
          opt.innerText = groupName;
          groupSelect.appendChild(opt);
        }
      });

      groupSelect.disabled = false;
      const shops = rawData.filter(item => item.type_name === selectedType);
      displayShops(shops);
    }

    function onGroupChange() {
      document.getElementById("searchInput").value = "";
      const selectedType = document.getElementById("typeSelect").value;
      const selectedGroup = document.getElementById("groupSelect").value;

      let shops = rawData.filter(item => 
        item.type_name === selectedType && item.group_name === selectedGroup
      );

      displayShops(shops);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(1);
    }

    function displayShops(shops) {
      const listContainer = document.getElementById("shopList");
      listContainer.innerHTML = "";

      markers.forEach(m => map.removeLayer(m));
      markers = [];

      if (shops.length === 0) {
        listContainer.innerHTML = "<p style='grid-column: 1/-1; text-align: center; padding: 20px;'>ไม่พบร้านอาหารที่ค้นหา</p>";
        return;
      }

      shops.forEach(shop => {
        if (userLat && userLng && shop.lat && shop.lng) {
          shop.distance = calculateDistance(userLat, userLng, parseFloat(shop.lat), parseFloat(shop.lng));
        } else {
          shop.distance = null;
        }
      });

      if (userLat && userLng) {
        shops.sort((a, b) => (a.distance || 999) - (b.distance || 999));
      }

      shops.forEach(shop => {
        const card = document.createElement("div");
        card.className = "shop-card";

        const ratingText = parseFloat(shop.avg_rating) > 0 
          ? `⭐ ${shop.avg_rating} (${shop.review_count} รีวิว) 💬 ดูรีวิว` 
          : `⭐ ยังไม่มีรีวิว`;

        const distanceText = shop.distance ? `<span class="distance-tag">(📍 ${shop.distance} กม.)</span>` : '';
        const commentsJson = JSON.stringify(shop.comments || []).replace(/"/g, '&quot;');
        
        // ตรวจสอบลิงก์รูปภาพ
        const imgUrl = (shop.image_url && shop.image_url.trim() !== "") ? shop.image_url : DEFAULT_IMAGE;

        card.innerHTML = `
          <img src="${imgUrl}" class="shop-card-img" alt="${shop.shop_name}" onerror="this.src='${DEFAULT_IMAGE}'">
          <div class="shop-card-body">
            <h3>${shop.shop_name} ${distanceText}</h3>
            <div class="rating-badge" onclick="openViewReviewsModal('${shop.shop_name}', '${commentsJson}')">${ratingText}</div>
            <p>${shop.detail || 'ไม่มีข้อมูลรายละเอียด'}</p>
            <div class="btn-group">
              ${shop.lat && shop.lng ? `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${shop.lat},${shop.lng}" target="_blank">🗺️ นำทาง</a>` : ''}
              ${shop.phone ? `<a class="btn btn-call" href="tel:${shop.phone}">📞 โทร</a>` : ''}
              <button class="btn btn-review" onclick="openReviewModal('${shop.shop_name}')">✍️ รีวิว</button>
              <button class="btn btn-share" onclick="shareShop('${shop.shop_name}', '${shop.lat}', '${shop.lng}')">🔗 แชร์</button>
            </div>
          </div>
        `;
        listContainer.appendChild(card);

        if (shop.lat && shop.lng) {
          const marker = L.marker([parseFloat(shop.lat), parseFloat(shop.lng)])
            .addTo(map)
            .bindPopup(`<b>${shop.shop_name}</b><br>${ratingText}<br>${shop.detail || ''}`);
          markers.push(marker);
        }
      });

      if (shops.length > 0 && shops[0].lat && shops[0].lng) {
        map.setView([parseFloat(shops[0].lat), parseFloat(shops[0].lng)], 14);
      }
    }

    function getUserLocation() {
      const statusEl = document.getElementById("geoStatus");

      if (!navigator.geolocation) {
        alert("อุปกรณ์หรือเบราว์เซอร์ของคุณไม่รองรับ GPS");
        return;
      }

      statusEl.innerText = "⏳ กำลังค้นหาพิกัด GPS ของคุณ...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;

          if (userMarker) {
            map.removeLayer(userMarker);
          }

          userMarker = L.marker([userLat, userLng])
            .addTo(map)
            .bindPopup("<b>📍 คุณอยู่ที่นี่</b>")
            .openPopup();

          map.setView([userLat, userLng], 15);
          statusEl.innerText = "✅ พบตำแหน่งของคุณแล้ว (คำนวณระยะห่างเรียบร้อย)";

          // โหลดรายการร้านค้าปัจจุบันใหม่เพื่อแสดงระยะทาง
          const searchText = document.getElementById("searchInput").value.trim();
          if (searchText !== "") {
            onSearchInput();
          } else {
            onGroupChange();
          }
        },
        (error) => {
          statusEl.innerText = "❌ ไม่สามารถระบุตำแหน่ง GPS ได้";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // --- ฟังก์ชันแชร์ร้านอาหาร ---
    function shareShop(shopName, lat, lng) {
      const mapLink = (lat && lng) ? ` https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : '';
      const shareText = `แนะนำร้านอร่อยเชียงของ: ${shopName}${mapLink}`;

      if (navigator.share) {
        navigator.share({
          title: shopName,
          text: shareText,
          url: window.location.href
        }).catch(err => console.log('Error sharing', err));
      } else {
        navigator.clipboard.writeText(shareText);
        alert("คัดลอกข้อความแนะนำร้านเรียบร้อยแล้ว! นำไปวางส่งใน LINE หรือ Facebook ได้เลยครับ");
      }
    }

    // --- ระบบเขียนรีวิว ---
    function openReviewModal(shopName) {
      currentShopForReview = shopName;
      document.getElementById("modalShopName").innerText = "✍️ เขียนรีวิว: " + shopName;
      document.getElementById("reviewComment").value = "";
      setRating(5);
      document.getElementById("reviewModal").style.display = "flex";
    }

    function closeReviewModal() {
      document.getElementById("reviewModal").style.display = "none";
    }

    function setRating(stars) {
      selectedRating = stars;
      const starSpans = document.querySelectorAll("#starContainer span");
      starSpans.forEach((span, idx) => {
        if (idx < stars) {
          span.classList.add("active");
        } else {
          span.classList.remove("active");
        }
      });
    }

    async function submitReview() {
      const comment = document.getElementById("reviewComment").value;
      const submitBtn = document.querySelector(".btn-submit");
      
      submitBtn.innerText = "กำลังบันทึก...";
      submitBtn.disabled = true;

      const payload = {
        shop_name: currentShopForReview,
        rating: selectedRating,
        comment: comment
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify(payload)
        });

        alert("ขอบคุณสำหรับรีวิวครับ! ข้อความของคุณอยู่ระหว่างการตรวจสอบจากผู้ดูแลระบบก่อนแสดงผลครับ");
        closeReviewModal();
        fetchData();
      } catch (error) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล โปรดลองอีกครั้ง");
        console.error("Error submitting review:", error);
      } finally {
        submitBtn.innerText = "ส่งรีวิว";
        submitBtn.disabled = false;
      }
    }

    // --- ระบบดูรีวิว ---
    function openViewReviewsModal(shopName, commentsJsonStr) {
      const comments = JSON.parse(commentsJsonStr.replace(/&quot;/g, '"'));
      document.getElementById("viewModalShopName").innerText = "💬 รีวิวร้าน: " + shopName;
      
      const container = document.getElementById("commentsListContainer");
      container.innerHTML = "";

      if (comments.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#777;'>ยังไม่มีข้อความรีวิว</p>";
      } else {
        comments.forEach(item => {
          const div = document.createElement("div");
          div.style.cssText = "background:#f1f3f5; padding:10px; border-radius:8px; margin-bottom:8px; font-size:14px;";
          div.innerHTML = `
            <div style="color:#ffc107; font-weight:bold; margin-bottom:3px;">${'★'.repeat(item.rating)} (${item.rating}/5)</div>
            <div style="color:#333;">${item.comment || 'ไม่ได้เขียนข้อความเพิ่มเติม'}</div>
          `;
          container.appendChild(div);
        });
      }

      document.getElementById("viewReviewsModal").style.display = "flex";
    }

    function closeViewReviewsModal() {
      document.getElementById("viewReviewsModal").style.display = "none";
    }

    window.onload = () => {
      initMap();
      fetchData();
    };
  </script>
</body>
</html>
